name: Provider health

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

concurrency:
  group: provider-health
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  provider-health:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Probe provider pages
        id: probe
        shell: bash
        run: |
          set -uo pipefail
          output="$RUNNER_TEMP/provider-status.json"
          previous="$RUNNER_TEMP/provider-status-previous.json"

          if git fetch origin provider-status; then
            git show FETCH_HEAD:provider-status.json > "$previous" || printf '{}' > "$previous"
          else
            printf '{}' > "$previous"
          fi

          classpath_file="$RUNNER_TEMP/provider-health-classpath"
          mvn_result=0
          mvn -B -ntp -Dstyle.color=never \
            test-compile dependency:build-classpath \
            "-Dmdep.outputFile=$classpath_file" || mvn_result=$?

          result=$mvn_result
          if [[ $mvn_result -eq 0 ]]; then
            java -Djava.awt.headless=true \
              "-Dprovider.url.check.output=$output" \
              "-Dprovider.url.check.previous-state=$previous" \
              -cp "target/test-classes:target/classes:$(cat "$classpath_file")" \
              sc.fiji.llm.provider.ProviderHealthProbe
            result=$?
          fi
          printf 'probe_exit_code=%s\n' "$result" >> "$GITHUB_OUTPUT"

          if [[ ! -s "$output" ]]; then
            printf '{"checked_at":"%s","status":"unknown","probe_exit_code":%s}\n' \
              "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$result" > "$output"
          fi

      - name: Generate provider badges
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/provider-status.json"
          badges="$RUNNER_TEMP/provider-badges"
          mkdir -p "$badges"

          jq -r 'to_entries[] | select(.value | type == "object") |
            select(.value.health? != null) | .key' "$output" | while IFS= read -r provider; do
            slug="$(printf '%s' "$provider" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-//; s/-$//')"
            health="$(jq -r --arg provider "$provider" '.[$provider].health // "unknown"' "$output")"

            case "$health" in
              unhealthy) color=red ;;
              review_required) color=yellow ;;
              *) color=brightgreen ;;
            esac

            jq -n --arg message "$provider" \
              --arg color "$color" \
              '{schemaVersion: 1, label: "", message: $message, color: $color}' \
              > "$badges/$slug.json"
          done

          jq -n \
            '{schemaVersion: 1, label: "", message: "Ollama", color: "brightgreen"}' \
            > "$badges/ollama.json"

      - name: Publish provider status
        shell: bash
        run: |
          set -euo pipefail
          branch_dir="$RUNNER_TEMP/provider-status-branch"

          status_snapshot() {
            jq -cS '
              {
                status: (.status // "unknown"),
                providers: [
                  to_entries[]
                  | select((.value | type) == "object")
                  | select(.value.health? != null)
                  | {name: .key, health: .value.health}
                ] | sort_by(.name)
              }
            ' "$1"
          }

          if git show-ref --verify --quiet refs/remotes/origin/provider-status; then
            current_statuses="$(status_snapshot "$RUNNER_TEMP/provider-status.json")"
            previous_statuses="$(status_snapshot "$RUNNER_TEMP/provider-status-previous.json")"
            if [[ "$current_statuses" == "$previous_statuses" ]]; then
              echo "Provider health statuses unchanged; skipping status commit."
              exit 0
            fi
          fi

          if git show-ref --verify --quiet refs/remotes/origin/provider-status; then
            git worktree add --detach "$branch_dir" refs/remotes/origin/provider-status
          else
            git worktree add --detach "$branch_dir" HEAD
            git -C "$branch_dir" checkout --orphan provider-status
          fi

          git -C "$branch_dir" rm -rf . || true
          cp "$RUNNER_TEMP/provider-status.json" "$branch_dir/provider-status.json"
          cp "$RUNNER_TEMP/provider-badges"/*.json "$branch_dir/"

          git -C "$branch_dir" config user.name "github-actions[bot]"
          git -C "$branch_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$branch_dir" add -A
          if git -C "$branch_dir" diff --cached --quiet; then
            exit 0
          fi
          git -C "$branch_dir" commit -m "Update provider health status"
          git -C "$branch_dir" push origin HEAD:provider-status

      - name: Report provider health
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          status="$(jq -r '.status // "unknown"' "$RUNNER_TEMP/provider-status.json")"
          case "$status" in
            healthy)
              exit 0
              ;;
            review_required|unhealthy|unknown)
              echo "Provider health status: $status"
              jq -r '.failures[]? // empty' "$RUNNER_TEMP/provider-status.json"
              echo "::error title=Provider health::$status"
              exit 1
              ;;
            *)
              echo "Unrecognized provider health status: $status" >&2
              exit 1
              ;;
          esac